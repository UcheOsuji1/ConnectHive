<style>

.headline{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;text-align:center;margin:0 0 24px}

.cards{display:flex;flex-direction:column;gap:16px}
.hmd-card{background:#fff;border:0.5px solid #d8d0bc;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.hmd-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hmd-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}

.hmd-stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.basics{display:flex;flex-wrap:wrap;gap:6px}
.basic{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#5a4e3c;background:#f5f0e2;border:0.5px solid #e0d8c8;border-radius:8px;padding:3px 9px}
.basic .k{color:#7a6a4a}
.hmd-reasons-list{display:flex;flex-wrap:wrap;gap:6px}

.hmd-cta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:10px 18px;cursor:pointer;border:none;min-height:40px}
.btn-gold{background:#c49a28;color:#1a1508}
.btn-ghost{background:#fff;color:#4a3a18;border:0.5px solid #d8d0bc;font-weight:500}
.cta-note{font-size:11.5px;color:#7a6a4a}
.hmd-new-hive{font-size:12.5px;color:#a07a14;font-weight:500;margin:0}
/* sheet */
.dim{background:rgba(26,21,8,.45);min-height:100%;padding:40px 20px;display:flex;justify-content:center;align-items:flex-start}
.sheet{width:100%;max-width:560px;background:#fffdf8;border-radius:18px;box-shadow:0 20px 60px rgba(26,21,8,.25);padding:24px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.sheet-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:500;margin:0;line-height:1.2}
.sheet-sub{font-size:12.5px;color:#6f6656;margin:0 0 18px}
.close{width:36px;height:36px;border-radius:50%;border:0.5px solid #e2dacb;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6f6656;flex-shrink:0}
.lbl{display:block;font-size:12px;font-weight:500;color:#4a3a18;margin:18px 0 8px}
.lbl .opt{font-weight:400;color:#8f8566;font-size:11px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick-row{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0.5px solid #d8d0bc;border-radius:12px;background:#fff;font-family:inherit;cursor:pointer}
.pick-row.selected{border-color:#c49a28;background:#fdf8ec;box-shadow:inset 0 0 0 0.5px #c49a28}

.pick-row.selected .radio{border-color:#c49a28}
.pick-row.selected .radio i{width:9px;height:9px;border-radius:50%;background:#c49a28}
.pick-main{flex:1;min-width:0}
.pick-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick-meta{font-size:11.5px;color:#7a6a4a;margin-top:3px}
.pick-skills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.sk{font-size:11px;border-radius:20px;padding:2px 9px;border:0.5px solid #e0d8c8;background:#f7f2e8;color:#5a4e3c}
.sk.have{background:#eaf3e3;border-color:#a9c98f;color:#2f5317}
.sk.near{background:#fdf3d6;border-color:#d8c080;color:#7a5a0c}
.fit-pill{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:2px 8px;background:#eaf7ee;color:#1a7a44;border:0.5px solid #7dd3a4}
.full-pill{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:20px;padding:2px 8px;background:#efe7d4;color:#5c5240}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#6f6656;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.inp{width:100%;height:42px;border:0.5px solid #d8d0bc;border-radius:10px;padding:0 13px;font-family:inherit;font-size:13px;background:#fff;color:#1a1508}

.sheet-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:16px;border-top:0.5px solid #efe8da;flex-wrap:wrap}
/* public hive dark */
.hive-page{background:#f5f0e8;padding:24px 0 60px}
.hive-inner{max-width:1080px;margin:0 auto;padding:0 20px}
.crumb{font-size:12px;color:#7a6a4a;margin-bottom:12px}

.dhp-content{flex:1;min-width:240px}
.dhp-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:#f3ecdd;line-height:1.15}
.dhp-meta{font-size:13px;color:#a89c84;margin:4px 0 10px}
.dhp-desc{font-size:14px;color:#c2b79d;line-height:1.6;margin:0 0 12px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font-size:12px;font-weight:500;color:#c2b79d;background:rgba(255,255,255,.05);border:1px solid rgba(120,100,60,.45);border-radius:999px;padding:3px 10px}
.dchip.gold{color:#e8c84a;background:rgba(196,154,40,.12);border-color:rgba(196,154,40,.35)}
.dhp-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.join{display:inline-flex;align-items:center;padding:10px 18px;background:linear-gradient(120deg,#e8c84a 0%,#c49a28 100%);color:#1a1508;font-family:inherit;font-size:13px;font-weight:700;border-radius:9px;border:none;cursor:pointer;min-height:42px}
.follow{display:inline-flex;align-items:center;padding:8px 16px;background:transparent;color:#e8c84a;border:1px solid rgba(196,154,40,.45);border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;min-height:38px}
.tabs{display:flex;border-bottom:1px solid rgba(51,41,21,.25);margin-bottom:20px}

.body{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.dsec{padding:20px 22px}
.dsec-label{font-size:11px;font-weight:700;color:#a89c84;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.drole{border:1px solid rgba(120,100,60,.4);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:rgba(255,255,255,.02)}

.dsk{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}

.side-row{display:flex;justify-content:space-between;font-size:12.5px;color:#c2b79d;padding:6px 0;border-bottom:1px solid rgba(120,100,60,.2)}

.ptitle{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;margin:0 0 4px}

.hrt-card{background:#fffdf8;border:1.5px solid #e9dfcf;border-radius:16px;box-shadow:0 8px 30px rgba(54,42,25,.05);padding:20px 22px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}

.hrt-id{display:flex;align-items:center;gap:12px;min-width:0}

.hrt-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700}
.hrt-meta{font-size:12px;color:#665e53;margin-top:3px}
.hrt-scores{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.pfit{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(52,122,97,.08);color:#347a61}

.applying{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:#fdf8ec;border:0.5px solid #e2c56e}
.applying-k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8a6510}
.applying-role{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600}
.applying-fit{font-size:12px;color:#4a3a18}
.applying-fit b{font-weight:700}
.applying .spacer{flex:1}
.hrt-msg{font-size:13.5px;color:#3a3028;font-style:italic;line-height:1.55;padding:10px 14px;background:#f5f0e8;border-radius:10px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:8px;background:#fff;border:0.5px solid #d8d0bc;color:#4a3a18;text-decoration:none}
.hrt-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid #e9dfcf}
.acc{background:linear-gradient(120deg,#d9b654 0%,#c49a28 100%);color:#17120a;border:none;border-radius:9px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
.dec{background:transparent;color:#6b5c3e;border:1.5px solid #e9dfcf;border-radius:9px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:40px}
.foot-meta{font-size:12px;color:#7a6a4a}
.warn{font-size:12px;color:#7a3218;background:#fdf0ea;border:0.5px solid #e6b8a4;border-radius:10px;padding:10px 12px}
.tag-new{font-family:'DM Sans',sans-serif;font-style:normal;font-size:9px;font-weight:600;letter-spacing:.08em;border-radius:20px;padding:2px 8px;text-transform:uppercase;background:#1a1508;color:#f5f0e8}
.tag-new.light{background:#e8c84a;color:#1a1508}
@media (max-width:700px){.body{grid-template-columns:minmax(0,1fr)}.dgrid{grid-template-columns:minmax(0,1fr)}.dhp-actions{align-items:flex-start}}
</style>
